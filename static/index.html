<!DOCTYPE html>
<html>
<head>
    <title>JASIRI NET — Battery Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/sites.css">
    <link rel="stylesheet" href="/static/css/movements.css">
    <link rel="stylesheet" href="/static/css/check-sites.css">
    <link rel="stylesheet" href="/static/css/users.css">
    <link rel="stylesheet" href="/static/css/roles.css">
    <link rel="stylesheet" href="/static/css/settings.css">
</head>
<body>

    <div class="login-screen" id="login-screen">
        <div class="login-box">
            <img src="/static/jn-logo.png" alt="Jasiri Net" class="login-logo">
            <h1 class="login-title">JASIRI NET <span>— OPS</span></h1>
            <p class="login-subtitle">Sign in to continue</p>
            <form id="login-form" class="panel-form">
                <input type="email" id="login-email" placeholder="Email" required autocomplete="email">
                <div class="password-field">
                    <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                    <button type="button" class="password-toggle-btn" id="login-password-toggle" aria-label="Show password" tabindex="-1">
                        <svg class="eye-icon eye-open" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 8C1 8 3.5 3 8 3C12.5 3 15 8 15 8C15 8 12.5 13 8 13C3.5 13 1 8 1 8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                            <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
                        </svg>
                        <svg class="eye-icon eye-closed" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" hidden>
                            <path d="M2 2L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                            <path d="M6.6 6.6C6.2 7 6 7.5 6 8C6 9.1 6.9 10 8 10C8.5 10 9 9.8 9.4 9.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                            <path d="M4 4.5C2.3 5.6 1 8 1 8C1 8 3.5 13 8 13C9.3 13 10.4 12.6 11.3 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M10.8 10.2C13.2 8.9 15 8 15 8C15 8 13.7 5.3 11 3.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <button type="submit">Sign In</button>
            </form>
            <a href="#" class="login-forgot">Forgot password?</a>
            <div class="form-msg" id="login-msg"></div>
        </div>
    </div>

    <div class="cmdk-overlay" id="cmdk-overlay" hidden>
        <div class="cmdk-box">
            <input type="text" id="cmdk-input" placeholder="Jump to..." autocomplete="off">
            <div class="cmdk-results" id="cmdk-results"></div>
        </div>
    </div>

    <header class="global-topbar" id="global-topbar" hidden>
        <button type="button" class="nav-toggle-btn" id="nav-toggle-btn" aria-label="Open navigation">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 4H14M2 8H14M2 12H14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
        </button>

        <div class="global-topbar-brand">
            <img src="/static/jn-logo.png" alt="Jasiri Net" class="global-topbar-logo">
            <div class="global-topbar-name">JASIRI NET <span>— OPS</span></div>
        </div>

        <button type="button" class="topbar-search" id="topbar-search-btn">
            <svg class="topbar-search-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M11 11L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <span>Search anything...</span>
            <span class="topbar-search-kbd">⌘K</span>
        </button>

        <button type="button" class="topbar-icon-btn" id="notifications-btn" title="Notifications">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 2C6 2 4.5 3.5 4.5 5.5V8L3 10.5H13L11.5 8V5.5C11.5 3.5 10 2 8 2Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
                <path d="M6.5 12.5C6.5 13.3 7.2 14 8 14C8.8 14 9.5 13.3 9.5 12.5" stroke="currentColor" stroke-width="1.2"/>
            </svg>
            <span class="badge-count" id="notifications-badge" hidden>0</span>
        </button>

        <div class="topbar-avatar-wrap" id="topbar-avatar-wrap">
            <button type="button" class="topbar-avatar" id="topbar-avatar-btn"></button>
            <div class="topbar-avatar-menu" id="topbar-avatar-menu" hidden>
                <div class="topbar-avatar-info">
                    <div class="topbar-avatar-name" id="topbar-avatar-name"></div>
                    <div class="topbar-avatar-role" id="topbar-avatar-role"></div>
                </div>
                <div class="topbar-avatar-divider"></div>
                <button type="button" class="topbar-menu-item" id="settings-open-btn">
                    <span class="topbar-menu-item-icon">
                        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.2"/>
                            <path d="M13 8.6v-1.2l-1.4-.3a4.4 4.4 0 00-.5-1.2l.8-1.2-.9-.9-1.2.8a4.4 4.4 0 00-1.2-.5L8.3 3H7.1l-.3 1.4c-.4.1-.8.3-1.2.5l-1.2-.8-.9.9.8 1.2c-.2.4-.4.8-.5 1.2L2.4 7.4v1.2l1.4.3c.1.4.3.8.5 1.2l-.8 1.2.9.9 1.2-.8c.4.2.8.4 1.2.5l.3 1.4h1.2l.3-1.4c.4-.1.8-.3 1.2-.5l1.2.8.9-.9-.8-1.2c.2-.4.4-.8.5-1.2z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    Settings
                </button>
                <div class="topbar-avatar-divider"></div>
                <button type="button" class="topbar-menu-item topbar-menu-item-danger" id="logout-btn">
                    <span class="topbar-menu-item-icon">
                        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 2H3.5A1.5 1.5 0 002 3.5v9A1.5 1.5 0 003.5 14H6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M10.5 11L14 8L10.5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M14 8H6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                        </svg>
                    </span>
                    Log out
                </button>
            </div>
        </div>
    </header>

    <div class="layout" id="app-layout" hidden>
        <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
        <nav class="sidebar" id="sidebar">

            <div class="nav-category">
                <button class="nav-heading active" data-view="dashboard" data-label="Batteries">
                    <span class="nav-heading-label">
                        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="1" y="4" width="12" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                            <rect x="13.5" y="6.5" width="1.5" height="3" rx="0.5" fill="currentColor"/>
                            <rect x="3" y="6" width="4" height="4" fill="currentColor"/>
                        </svg>
                        Batteries
                    </span>
                    <span class="nav-badge" id="battery-nav-badge" hidden>0</span>
                </button>
            </div>

            <div class="nav-category">
                <button class="nav-heading" data-view="sites" data-label="Sites">
                    <span class="nav-heading-label">
                        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 14S13 9.5 13 6a5 5 0 10-10 0c0 3.5 5 8 5 8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                            <circle cx="8" cy="6" r="1.6" stroke="currentColor" stroke-width="1.3"/>
                        </svg>
                        Sites
                    </span>
                    <span class="nav-badge" id="sites-nav-badge" hidden>0</span>
                </button>
            </div>

            <div class="nav-category">
                <button class="nav-heading" data-view="users" data-label="Users">
                    <span class="nav-heading-label">
                        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
                            <path d="M3 14c0-2.5 2.2-4.5 5-4.5s5 2 5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                        </svg>
                        Users
                    </span>
                </button>
            </div>

            <div class="nav-category">
                <button class="nav-heading" data-view="roles" data-label="Roles">
                    <span class="nav-heading-label">
                        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 1.5L14 4V8C14 11.5 11.5 13.8 8 14.5C4.5 13.8 2 11.5 2 8V4L8 1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                        </svg>
                        Roles
                    </span>
                </button>
            </div>
        </nav>

        <main class="content">
            <div data-view-mount="dashboard"></div>
            <div data-view-mount="sites"></div>
            <div data-view-mount="movements"></div>
            <div data-view-mount="check-sites"></div>
            <div data-view-mount="users"></div>
            <div data-view-mount="roles"></div>
            <div data-view-mount="settings"></div>
        </main>
    </div>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
