<!DOCTYPE html>
<html>
<head>
    <title>JASIRI NET — Battery Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <!-- The saved theme and animations choice, set before the first paint so
         a light-mode user never sees a dark flash. static/js/theme.js owns
         the rest. -->
    <script>
        try {
            if (localStorage.getItem("theme") === "light") {
                document.documentElement.dataset.theme = "light";
                document.querySelector('meta[name="theme-color"]').content = "#f2f3f5";
            }
            if (localStorage.getItem("motion") === "off") document.documentElement.dataset.motion = "off";
        } catch (e) { /* private mode: stay dark, animations on */ }
    </script>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/static/icons/favicon.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Jasiri Ops">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="preload" as="image" href="/static/icons/splash.png">
    <!-- Inline so the opening screen paints before any stylesheet loads. Only
         the installed app shows it: Android's own splash is just the app icon,
         so this is what puts JASIRI NET on screen at launch. -->
    <style>
        #app-splash { display: none; }
        @media (display-mode: standalone) {
            #app-splash {
                display: flex; position: fixed; inset: 0; z-index: 99999;
                align-items: center; justify-content: center;
                background: #000; transition: opacity .25s ease;
            }
            #app-splash img { width: min(78vw, 360px); height: auto; }
        }
    </style>

    <div class="login-screen" id="login-screen" hidden>

            <div class="login-frame"><div class="login-box">
                <img src="/static/jn-logo.png" alt="Jasiri Net" class="login-logo">

                        <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" id="login-password-toggle" aria-label="Show password" tabindex="-1">

                                <path d="M1 8C1 8 3.5 3 8 3C12.5 3 15 8 15 8C15 8 12.5 13 8 13C3.5 13 1 8 1 8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
                            </svg>
                            <svg class="eye-icon eye-closed" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" hidden>
                                <path d="M2 2L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>

                            </svg>
                        </button>
                    </div>
                    <button type="submit" class="login-submit">
                        <span>Sign In</span>
                        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
                    </button>
                </form>
                <a href="#" class="login-forgot" id="login-forgot" aria-expanded="false" aria-controls="login-hint">Forgot password?</a>
                <p class="login-hint" id="login-hint" hidden>Ask an admin to set a new password for you. They can do it in System → Users.</p>

    <script>
        // Holds the opening screen long enough to read, and never longer than
        // 4s so a slow font or image can't leave it covering the app.
        (function () {
            const splash = document.getElementById("app-splash");
            let gone = false;
            function hide() {
                if (gone) return;
                gone = true;
                splash.style.opacity = "0";
                setTimeout(() => splash.remove(), 300);
            }
            const whenLoaded = () => setTimeout(hide, Math.max(0, 1400 - performance.now()));
            if (document.readyState === "complete") whenLoaded();
            else window.addEventListener("load", whenLoaded);
            setTimeout(hide, 4000);
        })();

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
        }
    </script>
