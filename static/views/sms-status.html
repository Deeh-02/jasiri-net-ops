    <section class="view" id="view-sms-status" hidden>
        <div class="page-header-row">
            <h1 class="page-title">SMS Status</h1>
        </div>

        <div class="toolbar sms-status-filters">
            <label class="toolbar-field"><span>From</span> <input type="date" class="control" id="sms-status-start"></label>
            <label class="toolbar-field"><span>To</span> <input type="date" class="control" id="sms-status-end"></label>
            <label class="toolbar-field"><span>Channel</span>
                <select class="control" id="sms-status-channel">
                    <option value="sms">SMS</option>
                    <option value="whatsapp">WhatsApp</option>
                    <option value="in_app">In-app</option>
                    <option value="">All</option>
                </select>
            </label>
            <label class="toolbar-field"><span>Status</span>
                <select class="control" id="sms-status-status">
                    <option value="">All</option>
                    <option value="sent">Sent</option>
                    <option value="failed">Failed</option>
                    <option value="not_configured">Not configured</option>
                    <option value="rate_limited">Rate limited</option>
                    <option value="skipped_quiet_hours">Quiet hours</option>
                </select>
            </label>
        </div>

        <div class="summary-strip" id="sms-status-summary" aria-label="Totals for this period"></div>

        <div class="table-scroll table-compact">
            <table id="sms-status-table" class="table-dense">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Type</th>
                        <th>Channel</th>
                        <th>Recipient</th>
                        <th>Mobile No</th>
                        <th>Site</th>
                        <th>Status</th>
                        <th>Provider response</th>
                        <th aria-sort="descending">Sent</th>
                    </tr>
                </thead>
                <tbody id="sms-status-rows" data-skeleton="9"></tbody>
            </table>
        </div>
    </section>
