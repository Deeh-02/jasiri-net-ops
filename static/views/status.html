    <section class="view" id="view-status" hidden>
        <div class="page-header-row">
            <h1 class="page-title">Network <span>Status</span></h1>
            <div class="status-header-side">
                <button type="button" id="manage-sites-link-btn" class="header-sub-link" hidden>Manage sites</button>
                <div class="status-feed" id="status-feed">
                    <span class="status-feed-dot"></span>
                    <span id="status-feed-text">Connecting</span>
                </div>
            </div>
        </div>

        <div class="status-hero" id="status-hero"></div>

        <div class="status-problems" id="status-problems"></div>

        <div class="stat-grid" id="status-totals"></div>

        <div class="table-scroll">
            <table id="status-table">
                <thead>
                    <tr>
                        <th class="col-frozen">Site</th>
                        <th>Status</th>
                        <th>Online now</th>
                        <th>Since</th>
                        <th>Revenue today</th>
                    </tr>
                </thead>
                <tbody id="status-rows"></tbody>
            </table>
        </div>
    </section>
