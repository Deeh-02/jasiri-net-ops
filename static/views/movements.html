    <section class="view" id="view-movements" hidden>
        <div class="page-header-row">
            <h1 class="page-title">Movements</h1>
            <label class="checkbox-row">
                <input type="checkbox" id="movements-show-history">
                Show history
            </label>
        </div>
        <div class="summary-strip" id="movements-summary" aria-label="Movements in progress"></div>
        <div class="table-scroll table-compact">
            <table id="movements-table">
                <thead>
                    <tr>
                        <th>Battery</th>
                        <th>Route</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th aria-sort="descending">Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="movements-rows" data-skeleton="6"></tbody>
            </table>
        </div>
    </section>
