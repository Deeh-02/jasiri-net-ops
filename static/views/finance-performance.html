    <section class="view" id="view-finance-performance" hidden>

            <div>
                <h1 class="page-title">Finance <span>Performance</span></h1>
                <p class="page-subtitle">After all costs, did the business make money this month, and where did it go?</p>
            </div>
            <span class="fin-perf-status" id="fin-perf-status"></span>
        </div>

        <div class="toolbar">
            <div class="fleet-range" id="fin-perf-segment" role="group" aria-label="Segment">

        </div>
