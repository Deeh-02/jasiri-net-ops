    <div class="modal-overlay" id="add-inventory-transaction-overlay" hidden>
        <div class="modal-box">
            <h3>Log Transaction</h3>
            <form id="inventory-transaction-form" class="panel-form">
                <select id="inventory-transaction-action" required>
                    <option value="" disabled selected>Action...</option>
                    <option value="In">In</option>
                    <option value="Transfer">Transfer</option>
                    <option value="Adjustment">Adjustment</option>
                    <option value="Return">Return</option>
                    <option value="Write-off">Write-off</option>
                </select>
                <select id="inventory-transaction-item" required>
                    <option value="" disabled selected>Item...</option>
                </select>

                <input type="number" step="any" id="inventory-transaction-qty" placeholder="Qty / Length">

                <div id="inventory-transaction-to-location-row">
                    <select id="inventory-transaction-to-location">
                        <option value="">To location...</option>
                    </select>
                </div>
                <select id="inventory-transaction-from-location">
                    <option value="">From location (optional)</option>
                </select>
                <select id="inventory-transaction-site-location">
                    <option value="">Site (optional)</option>
                </select>
                <select id="inventory-transaction-activity">
                    <option value="">Activity (optional)...</option>
                    <option value="Installation">Installation</option>
                    <option value="Expansion">Expansion</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Repair-Replacement">Repair-Replacement</option>
                    <option value="Relocation">Relocation</option>
                    <option value="Decommission">Decommission</option>
                </select>
                <select id="inventory-transaction-issued-to">
                    <option value="">Issued to (optional)</option>
                </select>
                <textarea id="inventory-transaction-notes" placeholder="Notes (optional)"></textarea>

                <div class="modal-actions">
                    <button type="button" id="add-inventory-transaction-cancel" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Log Transaction</button>
                </div>
            </form>
            <div class="form-msg" id="inventory-transaction-msg"></div>
        </div>
    </div>

    <section class="view" id="view-inventory-log" hidden>
        <div class="page-header-row">
            <h1 class="page-title">Inventory Log</h1>
            <div class="header-action-group">
                <select id="inventory-log-category-filter" class="inventory-filter-select">
                    <option value="">All Categories</option>
                </select>
                <select id="inventory-log-action-filter" class="inventory-filter-select">
                    <option value="">All Actions</option>
                    <option value="In">In</option>
                    <option value="Transfer">Transfer</option>
                    <option value="Adjustment">Adjustment</option>
                    <option value="Return">Return</option>
                    <option value="Write-off">Write-off</option>
                    <option value="Out">Out</option>
                    <option value="Reconciled">Reconciled</option>
                </select>
                <button type="button" id="add-inventory-transaction-open-btn" class="header-sub-link">+ Log Transaction</button>
            </div>
        </div>

        <div class="table-scroll">
            <table id="inventory-log-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Action</th>
                        <th>SKU/Spec</th>
                        <th>Qty/Length</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Site</th>
                        <th>Activity</th>
                        <th>Issued To</th>
                        <th>Logged By</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="inventory-log-rows"></tbody>
            </table>
        </div>
    </section>
