    <div class="modal-overlay" id="add-inventory-transaction-overlay" hidden>
        <div class="modal-box">
            <h3>Log Transaction</h3>
            <form id="inventory-transaction-form" class="panel-form">
                <select id="inventory-transaction-action" required>
                    <option value="" disabled selected>Action...</option>
                    <option value="Transfer">Transfer</option>
                    <option value="Adjustment">Adjustment</option>
                    <option value="Return">Return</option>
                    <option value="Write-off">Write-off</option>
                </select>
                <div class="item-search-field">
                    <input type="text" id="inventory-transaction-item-search" placeholder="Search item — name, SKU, serial, lot, reel..." autocomplete="off">
                    <div class="item-search-suggestions" id="inventory-transaction-item-suggestions" hidden></div>
                </div>
                <input type="hidden" id="inventory-transaction-item">

                <div class="qty-stepper">
                    <input type="number" step="any" id="inventory-transaction-qty" placeholder="Qty / Length">
                    <div class="qty-stepper-buttons">
                        <button type="button" class="qty-stepper-btn" data-dir="up" tabindex="-1" aria-label="Increase">▲</button>
                        <button type="button" class="qty-stepper-btn" data-dir="down" tabindex="-1" aria-label="Decrease">▼</button>
                    </div>
                </div>

                <div id="inventory-transaction-asset-status-row" hidden>
                    <select id="inventory-transaction-asset-status">
                        <option value="" disabled selected>Status...</option>
                        <option value="Active">Active</option>
                        <option value="Faulty">Faulty</option>
                        <option value="In Repair">In Repair</option>
                        <option value="Decommissioned">Decommissioned</option>
                    </select>
                    <p class="form-hint">Required to return a serialized asset — never inferred from its prior status.</p>
                </div>

                <!-- Transfer only — moves stock between two stores without going
                     through a job. Free-typed autocomplete, same pattern as
                     Add/Edit Unit's Location field, resolved server-side to a
                     location row (creating one on the fly if it's new). -->
                <div id="inventory-transaction-to-location-row" hidden>
                    <input type="text" id="inventory-transaction-to-location" list="inventory-transaction-to-location-suggestions" placeholder="To location..." autocomplete="off">
                    <datalist id="inventory-transaction-to-location-suggestions"></datalist>
                </div>
                <div id="inventory-transaction-from-location-row" hidden>
                    <input type="text" id="inventory-transaction-from-location" list="inventory-transaction-from-location-suggestions" placeholder="From location (optional — defaults to the item's current location)" autocomplete="off">
                    <datalist id="inventory-transaction-from-location-suggestions"></datalist>
                </div>

                <textarea id="inventory-transaction-notes" placeholder="Notes (optional)"></textarea>

                <div class="modal-actions">
                    <button type="button" id="add-inventory-transaction-cancel" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Log Transaction</button>
                </div>
            </form>
            <div class="form-msg" id="inventory-transaction-msg"></div>
        </div>
    </div>

    <div class="modal-overlay" id="transaction-detail-overlay" hidden>
        <div class="modal-box">
            <div class="dashboard-view-battery-header">
                <h3>Transaction <span id="transaction-detail-label"></span></h3>
                <button type="button" id="transaction-detail-close" class="dashboard-modal-close-btn">&times;</button>
            </div>
            <div id="transaction-detail-fields"></div>
            <div class="modal-actions" id="transaction-detail-actions"></div>
        </div>
    </div>

    <div class="modal-overlay" id="reconcile-cut-overlay" hidden>
        <div class="modal-box">
            <h3>Reconcile Cut <span id="reconcile-cut-label"></span></h3>
            <form id="reconcile-cut-form" class="panel-form">
                <p class="form-hint" id="reconcile-cut-out-hint"></p>
                <input type="number" step="any" min="0" id="reconcile-length-used" placeholder="Length used (m)" required>
                <input type="number" step="any" min="0" id="reconcile-length-returned" placeholder="Length returned (m)" required>
                <p class="form-hint" id="reconcile-usable-hint"></p>
                <input type="text" id="reconcile-new-cut-id" placeholder="New Cut ID for the returned remainder">
                <textarea id="reconcile-notes" placeholder="Notes (optional)"></textarea>
                <div class="modal-actions">
                    <button type="button" id="reconcile-cut-cancel" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Reconcile</button>
                </div>
            </form>
            <div class="form-msg" id="reconcile-cut-msg"></div>
        </div>
    </div>

    <section class="view" id="view-inventory-log" hidden>
        <div class="page-header-row">
            <h1 class="page-title">Inventory Log</h1>
            <div class="header-action-group">
                <input type="text" id="inventory-log-search" class="inventory-filter-search" placeholder="Search name, SKU, serial...">
                <select id="inventory-log-category-filter" class="inventory-filter-select">
                    <option value="">All Categories</option>
                </select>
                <select id="inventory-log-action-filter" class="inventory-filter-select">
                    <option value="">All Actions</option>
                    <option value="In">In</option>
                    <option value="Transfer">Transfer</option>
                    <option value="Adjustment">Adjustment</option>
                    <option value="Return">Return</option>
                    <option value="Write-off">Write-off</option>
                    <option value="Out">Issue</option>
                    <option value="Reconciled">Reconciled</option>
                </select>
                <button type="button" id="export-inventory-log-csv-btn" class="header-sub-link">Export CSV</button>
                <button type="button" id="add-inventory-transaction-open-btn" class="header-sub-link">+ Log Transaction</button>
            </div>
        </div>

        <div class="table-scroll">
            <table id="inventory-log-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Action</th>
                        <th>SKU/Spec</th>
                        <th>Qty/Length</th>
                        <th>Movement</th>
                        <th>By</th>
                    </tr>
                </thead>
                <tbody id="inventory-log-rows"></tbody>
            </table>
        </div>
        <div class="dashboard-logs-pagination-row" id="inventory-log-pagination"></div>
    </section>
