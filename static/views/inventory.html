    <!-- Product-level edit only — reachable from the Items and Stock tables'
         SKU-aggregate row (same shared component, see inventory-common.js),
         applies to every active unit under that SKU/spec at once (there's
         no separate products table — see architecture.md). Final field set:
         Category, SKU, Name, Spec/Capacity — Make/Model and Supplier live
         at unit level instead (Edit Unit modal in stock.html), since both
         can genuinely vary batch-to-batch or unit-to-unit even under one
         SKU. Unit of Measure was dropped entirely (unused right now — can
         be added back if a real need surfaces). -->
    <div class="modal-overlay" id="edit-product-overlay" hidden>
        <div class="modal-box">
            <h3>Edit Product</h3>
            <form id="edit-product-form" class="panel-form">
                <select id="edit-product-category" required></select>
                <input type="text" id="edit-product-sku" placeholder="SKU" required>
                <input type="text" id="edit-product-name" placeholder="Name" required>

                <div data-item-type-fields="asset_serialized" hidden>
                    <input type="text" id="edit-product-spec-capacity" placeholder="Spec/Capacity (optional)">
                </div>
                <div data-item-type-fields="inventory_length" hidden>
                    <input type="text" id="edit-product-spec" placeholder="Spec (e.g. 24C ADSS)" required>
                </div>

                <div class="modal-actions">
                    <button type="button" id="edit-product-cancel" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
            <div class="form-msg" id="edit-product-msg"></div>
        </div>
    </div>

    <!-- Add Item wizard — Items' own header action now (Issue/Return moved
         to Stock instead). Add Product (Step 1, one-time per SKU/spec) then
         Add Unit (Step 2, repeats per physical item/batch/cut). -->
    <div class="modal-overlay" id="add-inventory-item-overlay" hidden>
        <div class="modal-box dashboard-modal-box-lg">
            <div class="dashboard-view-battery-header">
                <h3 id="add-item-title">Add Item</h3>
                <button type="button" id="add-item-close" class="dashboard-modal-close-btn">&times;</button>
            </div>

            <!-- Step 0: existing product (skips straight to Add Unit) vs new
                 product (walks Add Product first). Most usage after initial
                 setup goes through Existing. -->
            <div id="add-item-step-choice">
                <p class="form-hint">Is this a unit of a product that's already set up, or a brand-new product?</p>
                <div class="add-item-choice-row">
                    <button type="button" id="add-item-choice-existing" class="add-item-choice-tab">Existing product</button>
                    <button type="button" id="add-item-choice-new" class="add-item-choice-tab">New product</button>
                </div>
            </div>

            <!-- Step 0b: product search, Existing product path only. -->
            <div id="add-item-step-search" hidden>
                <input type="text" id="add-item-product-search-input" placeholder="Search by name or SKU...">
                <div id="add-item-product-results" class="add-item-product-results"></div>
                <div class="modal-actions">
                    <button type="button" id="add-item-search-back" class="btn-secondary">Back</button>
                </div>
            </div>

            <!-- Step 1: Add Product — one-time per SKU/spec, New product path
                 only. Final field set: Category, SKU, Name, Spec/Capacity,
                 Reorder Level — Make/Model and Supplier are entered at Step
                 2 (Add Unit) instead, since both can vary per unit even
                 under one SKU. Unit of Measure was dropped entirely (unused
                 right now — can be added back if a real need surfaces). -->
            <div id="add-item-step-product" hidden>
                <form id="add-item-product-form" class="panel-form">
                    <select id="add-item-product-category" required>
                        <option value="" disabled selected>Category...</option>
                    </select>
                    <input type="text" id="add-item-product-sku" placeholder="SKU" required>
                    <input type="text" id="add-item-product-name" placeholder="Name" required>

                    <div data-item-type-fields="asset_serialized" hidden>
                        <input type="text" id="add-item-product-spec-capacity" placeholder="Spec/Capacity (optional)">
                    </div>
                    <div data-item-type-fields="inventory_length" hidden>
                        <input type="text" id="add-item-product-spec" placeholder="Spec (e.g. 24C ADSS)" required>
                    </div>

                    <div class="qty-stepper">
                        <input type="number" step="any" min="0" id="add-item-product-reorder-level" placeholder="Reorder level (optional — can be set later)">
                        <div class="qty-stepper-buttons">
                            <button type="button" class="qty-stepper-btn" data-dir="up" tabindex="-1" aria-label="Increase">▲</button>
                            <button type="button" class="qty-stepper-btn" data-dir="down" tabindex="-1" aria-label="Decrease">▼</button>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="add-item-product-back" class="btn-secondary">Back</button>
                        <button type="submit" class="btn-primary">Next: Add Unit</button>
                    </div>
                </form>
            </div>

            <!-- Step 2: Add Unit — repeats per physical item/batch/cut. -->
            <div id="add-item-step-unit" hidden>
                <div class="add-item-product-summary" id="add-item-unit-product-summary"></div>
                <form id="add-item-unit-form" class="panel-form">
                    <!-- Free-typed with autocomplete, same pattern as Issue/
                         Return Materials' Site field — matches or creates a
                         location on submit (see get_or_create_location_by_name
                         in routers/inventory.py), except this one only
                         matches/creates is_store=true rows (stores/
                         warehouses), never job sites. -->
                    <input type="text" id="add-item-unit-location" list="add-item-unit-location-suggestions" placeholder="Location (optional)" autocomplete="off">
                    <datalist id="add-item-unit-location-suggestions"></datalist>

                    <div data-item-type-fields="asset_serialized" hidden>
                        <input type="text" id="add-item-unit-serial-number" placeholder="Serial number">
                        <input type="text" id="add-item-unit-make-model" placeholder="Make/Model (optional)">
                        <select id="add-item-unit-asset-status">
                            <option value="Active">Active</option>
                            <option value="Deployed">Deployed</option>
                            <option value="Faulty">Faulty</option>
                            <option value="In Repair">In Repair</option>
                            <option value="Decommissioned">Decommissioned</option>
                        </select>
                        <div id="add-item-unit-assigned-to-row" hidden>
                            <select id="add-item-unit-assigned-to">
                                <option value="">Assigned to (optional)</option>
                            </select>
                        </div>
                        <input type="date" id="add-item-unit-install-date" placeholder="Install date">
                    </div>

                    <div data-item-type-fields="inventory_quantity" hidden>
                        <input type="text" id="add-item-unit-batch-lot" placeholder="Batch/Lot">
                        <input type="date" id="add-item-unit-expiry-date" placeholder="Expiry date">
                        <div class="qty-stepper">
                            <input type="number" step="any" id="add-item-unit-quantity-on-hand" placeholder="Quantity on hand">
                            <div class="qty-stepper-buttons">
                                <button type="button" class="qty-stepper-btn" data-dir="up" tabindex="-1" aria-label="Increase">▲</button>
                                <button type="button" class="qty-stepper-btn" data-dir="down" tabindex="-1" aria-label="Decrease">▼</button>
                            </div>
                        </div>
                    </div>

                    <div data-item-type-fields="inventory_length" hidden>
                        <input type="text" id="add-item-unit-cut-reel-id" placeholder="Cut/Reel ID">
                        <div class="qty-stepper">
                            <input type="number" step="any" id="add-item-unit-length-received" placeholder="Length received (m)">
                            <div class="qty-stepper-buttons">
                                <button type="button" class="qty-stepper-btn" data-dir="up" tabindex="-1" aria-label="Increase">▲</button>
                                <button type="button" class="qty-stepper-btn" data-dir="down" tabindex="-1" aria-label="Decrease">▼</button>
                            </div>
                        </div>
                    </div>

                    <input type="text" id="add-item-unit-supplier" placeholder="Supplier (optional)">
                    <div class="qty-stepper">
                        <input type="number" step="any" id="add-item-unit-cost" placeholder="Unit cost (optional)">
                        <div class="qty-stepper-buttons">
                            <button type="button" class="qty-stepper-btn" data-dir="up" tabindex="-1" aria-label="Increase">▲</button>
                            <button type="button" class="qty-stepper-btn" data-dir="down" tabindex="-1" aria-label="Decrease">▼</button>
                        </div>
                    </div>
                    <textarea id="add-item-unit-notes" placeholder="Notes (optional)"></textarea>

                    <div class="modal-actions">
                        <button type="button" id="add-item-unit-back" class="btn-secondary">Back</button>
                        <button type="submit" class="btn-primary">Save Unit</button>
                    </div>
                </form>
            </div>

            <!-- Step 2 (Asset Core, Existing product only): batch quantity
                 instead of one unit at a time — asks how many arrived
                 together, and Location/Status/Cost/Install Date/Notes apply
                 once to the whole batch. Consumables Core's batch total
                 already lives in one row's Quantity field, and Cable Core's
                 units are individually distinct cuts, so both keep using
                 the single-unit Step 2 above instead. -->
            <div id="add-item-step-batch" hidden>
                <div class="add-item-product-summary" id="add-item-batch-product-summary"></div>
                <form id="add-item-batch-form" class="panel-form">
                    <div class="qty-stepper">
                        <input type="number" min="1" step="1" id="add-item-batch-quantity" placeholder="Quantity to add" required>
                        <div class="qty-stepper-buttons">
                            <button type="button" class="qty-stepper-btn" data-dir="up" tabindex="-1" aria-label="Increase">▲</button>
                            <button type="button" class="qty-stepper-btn" data-dir="down" tabindex="-1" aria-label="Decrease">▼</button>
                        </div>
                    </div>

                    <input type="text" id="add-item-batch-location" list="add-item-batch-location-suggestions" placeholder="Location (optional)" autocomplete="off">
                    <datalist id="add-item-batch-location-suggestions"></datalist>

                    <input type="text" id="add-item-batch-make-model" placeholder="Make/Model (optional)">

                    <select id="add-item-batch-asset-status">
                        <option value="Active">Active</option>
                        <option value="Deployed">Deployed</option>
                        <option value="Faulty">Faulty</option>
                        <option value="In Repair">In Repair</option>
                        <option value="Decommissioned">Decommissioned</option>
                    </select>
                    <div id="add-item-batch-assigned-to-row" hidden>
                        <select id="add-item-batch-assigned-to">
                            <option value="">Assigned to (optional)</option>
                        </select>
                    </div>
                    <input type="date" id="add-item-batch-install-date" placeholder="Install date">

                    <input type="text" id="add-item-batch-supplier" placeholder="Supplier (optional)">
                    <div class="qty-stepper">
                        <input type="number" step="any" id="add-item-batch-unit-cost" placeholder="Unit cost (optional)">
                        <div class="qty-stepper-buttons">
                            <button type="button" class="qty-stepper-btn" data-dir="up" tabindex="-1" aria-label="Increase">▲</button>
                            <button type="button" class="qty-stepper-btn" data-dir="down" tabindex="-1" aria-label="Decrease">▼</button>
                        </div>
                    </div>
                    <textarea id="add-item-batch-notes" placeholder="Notes (optional)"></textarea>

                    <div class="modal-actions">
                        <button type="button" id="add-item-batch-back" class="btn-secondary">Back</button>
                        <button type="submit" class="btn-primary">Add Units</button>
                    </div>
                </form>
            </div>

            <!-- After a batch save: an editable list of the newly created
                 units so the manufacturer's real serial number (if known
                 and different from the auto-assigned internal placeholder)
                 and any per-unit Location/Status override can be entered
                 before closing the wizard. Each cell saves immediately via
                 PATCH /inventory/items/{id} on blur/change — same
                 click-to-edit-and-save pattern as Stock's Reorder Level
                 column. -->
            <div id="add-item-step-batch-review" hidden>
                <p class="form-hint" id="add-item-batch-review-heading"></p>
                <div class="table-scroll">
                    <table>
                        <thead><tr><th>Asset ID</th><th>Serial Number</th><th>Location</th><th>Status</th></tr></thead>
                        <tbody id="add-item-batch-review-rows"></tbody>
                    </table>
                </div>
                <div class="modal-actions">
                    <button type="button" id="add-item-batch-review-done-btn" class="btn-primary">Done</button>
                </div>
            </div>

            <!-- After a successful save — resets to a fresh Step 2 for the
                 same product so a batch of units can be added in sequence
                 without re-navigating (the "48 enclosures at once" case).
                 Existing-product Asset Core saves land on the Batch Review
                 step above instead of here. -->
            <div id="add-item-step-success" hidden>
                <p class="form-hint" id="add-item-success-message"></p>
                <div class="modal-actions">
                    <button type="button" id="add-item-add-another-btn" class="btn-secondary">+ Add another unit</button>
                    <button type="button" id="add-item-done-btn" class="btn-primary">Done</button>
                </div>
            </div>

            <div class="form-msg" id="inventory-item-msg"></div>
        </div>
    </div>

    <section class="view" id="view-inventory" hidden>
        <div class="page-header-row">
            <h1 class="page-title">Items</h1>
        </div>

        <div class="inventory-panel">
            <div class="inventory-panel-header">
                <h2>Items</h2>
                <div class="inventory-panel-header-actions">
                    <input type="text" id="inventory-items-search" class="inventory-filter-search" placeholder="Search name, SKU, serial...">
                    <select id="inventory-items-category-filter" class="inventory-filter-select">
                        <option value="">All Categories</option>
                    </select>
                    <button type="button" id="export-items-csv-btn" class="header-sub-link">Export CSV</button>
                    <button type="button" id="add-inventory-item-open-btn" class="header-sub-link">+ Add Item</button>
                </div>
            </div>
            <div class="table-scroll table-compact">
                <table id="inventory-items-table">
                    <thead id="inventory-items-thead"></thead>
                    <tbody id="inventory-items-rows"></tbody>
                </table>
            </div>
        </div>
    </section>
