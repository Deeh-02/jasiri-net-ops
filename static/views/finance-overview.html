    <section class="view fin-view" id="view-finance-overview" hidden>
        <div class="page-header-row">
            <div>
                <h1 class="page-title">Finance <span>Snapshot</span></h1>
                <p class="page-subtitle">Where the business stands this month: money in, money out and what is left.</p>
            </div>
            <span id="fin-ov-status"></span>
        </div>

        <div class="toolbar fin-range">
            <div class="toolbar-field"><span>From</span><div id="fin-ov-from"></div></div>
            <div class="toolbar-field"><span>To</span><div id="fin-ov-to"></div></div>
            <div class="fin-range-presets" id="fin-ov-presets" role="group" aria-label="Quick ranges">
                <button type="button" data-back="0">This month</button>
                <button type="button" data-back="2">Last 3 months</button>
                <button type="button" data-back="5">Last 6 months</button>
                <button type="button" data-back="year">This year</button>
            </div>
        </div>

        <div id="fin-ov-lead"></div>
        <div class="fin-kpis" id="fin-ov-kpis"></div>
        <div class="fin-grid" id="fin-ov-grid"></div>
    </section>
