    <section class="view" id="view-broadcast" hidden>
        <div class="page-header-row">
            <h1 class="page-title">Broadcast</h1>
        </div>

        <div class="broadcast-intro">
            <p>Send one SMS to PPPoE customers. Check the audience first &mdash; you'll see exactly how many people it reaches before anything is sent. A person with two accounts is texted once.</p>
        </div>

        <div class="broadcast-form">
            <fieldset class="broadcast-field">
                <legend>Routers</legend>
                <div id="broadcast-routers" class="broadcast-routers"></div>
            </fieldset>

            <label class="broadcast-field">Customers
                <select id="broadcast-status">
                    <option value="active">Active (paying) only</option>
                    <option value="expired">Expired only</option>
                    <option value="all">Everyone</option>
                </select>
            </label>

            <fieldset class="broadcast-field">
                <legend>Message</legend>
                <textarea id="broadcast-message" rows="4" maxlength="480" spellcheck="true"></textarea>
                <div class="broadcast-message-meta">
                    <button type="button" class="broadcast-chip" id="broadcast-name-chip" title="Replaced with each customer's name">{{NAME}}</button>
                    <span id="broadcast-counter"></span>
                </div>
            </fieldset>

            <div class="broadcast-audience" id="broadcast-audience"></div>

            <div class="broadcast-actions">
                <button type="button" id="broadcast-preview-btn">Check audience</button>
                <button type="button" id="broadcast-send-btn" disabled>Send</button>
            </div>
            <div class="form-msg" id="broadcast-msg"></div>
        </div>

        <h2 class="broadcast-history-title">Sent broadcasts</h2>
        <div class="table-scroll">
            <table id="broadcast-table">
                <thead>
                    <tr>
                        <th>Sent</th>
                        <th>By</th>
                        <th>Audience</th>
                        <th>Message</th>
                        <th>Delivered</th>
                        <th>Failed</th>
                        <th>State</th>
                    </tr>
                </thead>
                <tbody id="broadcast-rows"></tbody>
            </table>
        </div>
    </section>
